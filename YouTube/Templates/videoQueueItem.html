<div class="videoItem queueItem __currentClass__">
	<div class="queueIndex">__number__</div>
	<div class="thumbnail">
		<img src="__thumbnail__" />
		<span class="videoDuration">__duration__</span>
		<div class="thumbnailOverlay">
			<a class="thumbnailPlay" href="javascript:window.external.VideoClick(__index__,'queuePlay')" title="Play Video"></a
			><a class="thumbnailRemove" href="javascript:window.external.VideoClick(__index__,'queueRemove')" title="Remove from Queue"></a>
			<span class="verticalAlign"></span>
			<div class="thumbnailOverlayShade"></div>
		</div>
	</div>
	<div class="videoTitle"><a href="javascript:window.external.VideoClick(__index__,'queuePlay')" title="__title__">__title__</a></div>
	<div class="videoAuthor">By __author__</div>
</div>
