<div id="videoStats">
	<div class="stat"><span class="viewcount">__viewcount__</span> views</div>
	<div class="stat">
		<div class="ratingBar"><div class="positive" style="width: __ratingP__"></div><div class="negative" style="width: __ratingN__"></div></div>
		<div class="ratingText"><span>__likes__</span> likes &nbsp; <span>__dislikes__</span> dislikes</div>
	</div>
	<div class="stat">
		<a id="authorLink" href="javascript:window.external.ActionClick('videoDescription', 'authorLink')" title="View more from this channel">__author__</a>
	</div>
	<div>
		<button id="subscribeBtn" onclick="subscribeClick()" class="Add this channel to your subscriptions"><span class="icon icon-subscribe"></span><span class="text-1">Subscribe</span><span class="text-2">Subscribed</span></button>
	</div>
</div>
<div id="videoTitle">__title__</div>
<div id="videoMeta">Published <span>__upload_date__</span></div>
<div id="videoActions">
	<button id="favoriteBtn" onclick="window.external.ActionClick('videoDescription', 'addFavorites')" class="__favoriteClass__" title="Add to or remove from Favorites"><span class="icon icon-favorite"></span><span class="text-1">Favorite</span><span class="text-2">Favorited</span></button
	><button id="downloadBtn" onclick="window.external.ActionClick('videoDescription', 'download')" class="__downloadClass__" title="__downloadTitle__"><span class="icon icon-download"></span><span class="text" id="downloadBtnText">__downloadText__</span></button>
</div>
<div id="videoDescription">__description__</div>
