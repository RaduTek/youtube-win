<div class="videoItem">
	<div class="thumbnail">
		<img src="__thumbnail__" />
		<span class="videoDuration">__duration__</span>
		<div class="thumbnailOverlay queueToggle" videoid="__videoId__">
			<a class="thumbnailPlay" href="javascript:window.external.VideoClick(__index__,'play')" title="Play Video"></a
			><a class="thumbnailQueue" href="javascript:window.external.VideoClick(__index__,'queue')" title="Add to Queue"></a
			><a class="thumbnailRemove" href="javascript:window.external.VideoClick(__index__,'queue')" title="Remove from Queue"></a
			><a class="thumbnailDownload" href="javascript:window.external.VideoClick(__index__,'download')" title="Download"></a>
			<span class="verticalAlign"></span>
			<div class="thumbnailOverlayShade"></div>
		</div>
	</div>
	<div class="videoTitle"><a href="javascript:window.external.VideoClick(__index__,'title')" title="__title__">__title__</a></div>
	<div class="videoDescription">__description__</div>
	<div class="videoInfo">By <a href="javascript:window.external.VideoClick(__index__,'author')">__author__</a> | __viewcount__ views | __upload_date__</div>
</div>
