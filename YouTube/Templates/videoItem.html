<div class="videoItem">
	<div class="thumbnail">
		<img src="__thumbnail__" />
		<span class="videoDuration">__duration__</span>
	</div>
	<div class="videoTitle"><a href="javascript:window.external.VideoClick(__index__,'title')" title="__title__">__title__</a></div>
	<div class="videoAuthor">By <a href="javascript:window.external.VideoClick(__index__,'author')">__author__</a></div>
	<div class="videoInfo">__viewcount__ &bull; __upload_date__</div>
</div>
